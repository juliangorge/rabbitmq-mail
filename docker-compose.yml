services:
  rabbitmq:
    # Versión fija: subir a mano revisando el camino de upgrade de RabbitMQ.
    image: rabbitmq:4.4.1-management
    # El nombre de nodo (rabbit@rmq) sale del hostname y está atado a los datos del volumen.
    hostname: rmq
    profiles: [rabbit]
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      # docker0 gateway IP: lets other containers reach RabbitMQ via
      # host.docker.internal without exposing the port to the internet.
      - "172.17.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf.d/90-octopy.conf:/etc/rabbitmq/conf.d/90-octopy.conf:ro
    healthcheck:
      # Como usuario rabbitmq: si corre como root antes del arranque crea la
      # .erlang.cookie con dueño root y el nodo no puede leerla (eacces).
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mail:
    build: .
    container_name: rabbitmq-mail
    # Broker runs outside this compose file (bound to 127.0.0.1/172.17.0.1 only)
    network_mode: host
    env_file: .env
    environment:
      RABBITMQ_SERVER: ${RABBITMQ_SERVER:-rabbitmq}
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: false
    restart: unless-stopped

volumes:
  rabbitmq_data:
