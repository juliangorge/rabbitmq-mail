services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    profiles: [rabbit]
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mail:
    build: .
    env_file: .env
    environment:
      RABBITMQ_SERVER: ${RABBITMQ_SERVER:-rabbitmq}
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: false
    restart: unless-stopped

volumes:
  rabbitmq_data:
