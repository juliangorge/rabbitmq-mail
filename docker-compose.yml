services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    profiles: [rabbit]
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      # docker0 gateway IP: lets other containers reach RabbitMQ via
      # host.docker.internal without exposing the port to the internet.
      - "172.17.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mail:
    build: .
    container_name: rabbitmq-mail
    # Broker runs outside this compose file (bound to 127.0.0.1/172.17.0.1 only)
    network_mode: host
    env_file: .env
    environment:
      RABBITMQ_SERVER: ${RABBITMQ_SERVER:-rabbitmq}
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: false
    restart: unless-stopped

volumes:
  rabbitmq_data:
